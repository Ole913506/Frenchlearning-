<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cahier — Französisch üben</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Karla:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CAHIER — Design-Tokens
   Papier: französisches Seyès-Heft. Tinte: dunkles Blau.
   Rot = Korrekturrand & Fehler. Orange (Rhodia) = Aktion.
   ============================================================ */
:root{
  --paper:#FCFBF8;
  --card:#FFFFFF;
  --ink:#17235A;
  --ink-2:#5A6690;
  --ink-3:#8F98B5;
  --seyes:#CBD6EC;
  --seyes-soft:#E6ECF7;
  --marge:#E0405F;
  --rhodia:#F26B21;
  --juste:#12855A;
  --line:#E3E5EE;
  --radius:14px;
  --shadow:0 1px 2px rgba(23,35,90,.06), 0 8px 24px -12px rgba(23,35,90,.18);
  --display:"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --body:"Karla",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:var(--body);
  color:var(--ink);
  background-color:var(--paper);
  background-image:
    repeating-linear-gradient(to right, transparent 0 39px, var(--seyes-soft) 39px 40px),
    repeating-linear-gradient(to bottom, transparent 0 39px, var(--seyes) 39px 40px);
  background-attachment:fixed;
  line-height:1.55;
  font-size:16px;
}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.1;letter-spacing:-.02em}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--rhodia);outline-offset:2px;border-radius:4px}

/* ---------- Kopf ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 96px}
.masthead{
  display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  padding:34px 0 22px;flex-wrap:wrap;
}
.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--marge);margin:0 0 6px;
}
.masthead h1{font-size:clamp(30px,5vw,46px);font-weight:800}
.masthead .sub{color:var(--ink-2);font-size:14px;margin:6px 0 0;max-width:46ch}
.scorebox{display:flex;gap:8px;align-items:center}
.chip{
  background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:7px 14px;font-family:var(--mono);font-size:12px;white-space:nowrap;
  box-shadow:var(--shadow);
}
.chip b{font-weight:500;color:var(--rhodia)}

/* ---------- Themenübersicht ---------- */
.sect{margin:30px 0 12px;display:flex;align-items:baseline;gap:12px}
.sect:first-child{margin-top:6px}
.sect h2{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.02em}
.sect span{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase}
.sect i{flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.topic{
  position:relative;text-align:left;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:17px 18px 17px 32px;box-shadow:var(--shadow);
  transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
.topic::before{
  content:"";position:absolute;left:18px;top:0;bottom:0;width:1px;background:var(--marge);opacity:.5;
}
.topic:hover{transform:translateY(-2px);border-color:#C9CFE4;box-shadow:0 2px 4px rgba(23,35,90,.07),0 16px 30px -16px rgba(23,35,90,.3)}
.topic .num{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.1em}
.topic .tname{display:block;font-family:var(--display);font-size:18px;margin:5px 0 5px;font-weight:700;letter-spacing:-.02em}
.topic .tdesc{display:block;font-size:13.5px;color:var(--ink-2)}
.topic .page{
  display:inline-block;margin-top:12px;font-family:var(--mono);font-size:11px;
  color:var(--marge);border:1px dashed rgba(224,64,95,.4);border-radius:6px;padding:2px 7px;
}

/* ---------- Drill-Ansicht ---------- */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0 18px}
.back{
  background:none;border:none;cursor:pointer;font-family:var(--mono);font-size:12px;
  color:var(--ink-2);padding:6px 2px;text-decoration:underline;text-underline-offset:3px;
}
.back:hover{color:var(--marge)}
.drill-title{font-size:clamp(22px,3.4vw,30px);font-weight:800}
.modes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.mode{
  cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:7px 14px;font-size:13px;transition:.12s;
}
.mode:hover{border-color:var(--ink-3)}
.mode[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

.subs{display:flex;gap:6px;flex-wrap:wrap;margin:-8px 0 20px;padding-left:2px}
.sub{cursor:pointer;background:transparent;border:1px solid var(--line);border-radius:8px;
  padding:5px 11px;font-size:12.5px;color:var(--ink-2);transition:.12s}
.sub:hover{border-color:var(--ink-3);color:var(--ink)}
.sub[aria-selected="true"]{background:var(--paper);border-color:var(--rhodia);color:var(--rhodia);font-weight:700}
.sheet{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:26px 26px 26px 54px;
}
.sheet::before{
  content:"";position:absolute;left:36px;top:0;bottom:0;width:1px;background:var(--marge);opacity:.5;
}
.sheet.plain{padding-left:26px}
.sheet.plain::before{display:none}

/* Aufgabe */
.qmeta{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px}
.qtext{font-family:var(--display);font-size:clamp(20px,3vw,27px);font-weight:600;line-height:1.3}
.qtext .gap{
  display:inline-block;min-width:80px;border-bottom:2px solid var(--seyes);
  text-align:center;color:var(--rhodia);
}
.qsub{color:var(--ink-2);font-size:14px;margin-top:10px}
.qsub .de{color:var(--ink)}

.answers{display:grid;gap:9px;margin-top:20px}
.opt{
  cursor:pointer;text-align:left;background:var(--paper);border:1px solid var(--line);
  border-radius:10px;padding:13px 15px;font-size:16px;transition:.12s;
}
.opt:hover:not(:disabled){border-color:var(--ink-3);background:#fff}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--juste);background:rgba(18,133,90,.07);color:var(--juste);font-weight:700}
.opt.wrong{border-color:var(--marge);background:rgba(224,64,95,.07);color:var(--marge);text-decoration:line-through}

.inputrow{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.inputrow input{
  flex:1 1 240px;min-width:0;font:inherit;font-size:19px;color:var(--ink);
  background:transparent;border:none;border-bottom:2px solid var(--seyes);
  padding:8px 4px;border-radius:0;
}
.inputrow input:focus{outline:none;border-bottom-color:var(--rhodia)}
.btn{
  cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:#fff;
  border-radius:10px;padding:11px 20px;font-size:15px;font-weight:700;transition:.12s;
}
.btn:hover{background:#0E1740}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--paper);border-color:var(--ink-3)}
.btn.accent{background:var(--rhodia);border-color:var(--rhodia)}
.btn.accent:hover{background:#DA5A13}

/* Korrektur am Rand */
.verdict{margin-top:20px;padding:14px 16px;border-radius:10px;font-size:15px;display:none}
.verdict.show{display:block;animation:rise .18s ease-out}
.verdict.ok{background:rgba(18,133,90,.08);color:var(--juste);border:1px solid rgba(18,133,90,.3)}
.verdict.no{background:rgba(224,64,95,.07);color:var(--marge);border:1px solid rgba(224,64,95,.3)}
.verdict.almost{background:rgba(242,107,33,.08);color:#B04B12;border:1px solid rgba(242,107,33,.35)}
.verdict b{font-family:var(--mono);font-weight:500}
.verdict .why{display:block;margin-top:6px;color:var(--ink-2);font-size:13.5px}
.mark{
  position:absolute;left:8px;top:24px;font-family:var(--display);font-size:26px;font-weight:800;
  color:var(--marge);opacity:0;transition:opacity .2s;
}
.mark.on{opacity:1;animation:stamp .25s ease-out}
.mark.ok{color:var(--juste)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes stamp{from{opacity:0;transform:scale(.6) rotate(-12deg)}to{opacity:1;transform:none}}

/* Karteikarte */
.flash{min-height:190px;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center;cursor:pointer}
.flash .front{font-family:var(--display);font-size:clamp(22px,4vw,32px);font-weight:700}
.flash .back{font-size:20px;color:var(--rhodia);font-weight:700}
.flash .hint{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase}
.flash .extra{font-size:14px;color:var(--ink-2)}

/* Satzbau */
.slots{
  min-height:60px;border-bottom:2px solid var(--seyes);display:flex;flex-wrap:wrap;gap:8px;
  align-items:center;padding:10px 2px;margin-top:18px;
}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.word{
  cursor:pointer;background:var(--paper);border:1px solid var(--line);border-radius:8px;
  padding:8px 13px;font-size:16px;transition:.12s;
}
.word:hover{border-color:var(--ink-3);background:#fff}
.slots .word{background:var(--ink);color:#fff;border-color:var(--ink)}
.slots .empty{color:var(--ink-3);font-size:14px;font-style:italic}

/* Zuordnen */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.match .col{display:grid;gap:8px;align-content:start}
.mitem{
  cursor:pointer;text-align:left;background:var(--paper);border:1px solid var(--line);
  border-radius:9px;padding:10px 12px;font-size:14.5px;transition:.12s;
}
.mitem:hover:not(:disabled){border-color:var(--ink-3)}
.mitem[data-state="sel"]{border-color:var(--rhodia);background:rgba(242,107,33,.08)}
.mitem[data-state="done"]{border-color:var(--juste);background:rgba(18,133,90,.07);color:var(--juste);cursor:default}
.mitem[data-state="miss"]{border-color:var(--marge);background:rgba(224,64,95,.07)}

/* Merkblatt / Tabellen */
.ref h3{font-size:22px;margin:34px 0 12px;font-weight:800}
.ref h3:first-child{margin-top:0}
.ref h4{font-size:15px;margin:22px 0 8px;color:var(--marge);font-family:var(--body);font-weight:700;letter-spacing:0}
.ref p{font-size:14.5px;color:var(--ink-2);margin:0 0 10px}
.ref .lead{font-size:16.5px;color:var(--ink);margin:0 0 18px;max-width:70ch}
.ref ol.steps{counter-reset:st;list-style:none;padding:0;margin:14px 0}
.ref ol.steps li{position:relative;padding:2px 0 0 42px;margin:0 0 14px;font-size:14.5px}
.ref ol.steps li::before{counter-increment:st;content:counter(st);position:absolute;left:0;top:0;
  width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--mono);
  font-size:12px;display:flex;align-items:center;justify-content:center}
.ref ol.steps .tbl{margin-top:8px}
.ref .ex{font-size:15px;background:var(--paper);border:1px dashed var(--seyes);border-radius:8px;
  padding:11px 13px;margin:10px 0;line-height:1.7}
.ref .ex b{color:var(--rhodia)}
.ref .rule{
  background:var(--paper);border-left:3px solid var(--rhodia);border-radius:0 8px 8px 0;
  padding:12px 14px;margin:12px 0;font-size:14.5px;
}
.ref .rule b{color:var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px;margin:6px 0 14px}
.tbl th,.tbl td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.tbl td.fr{font-weight:700}
.tbl td.ipa{font-family:var(--mono);color:var(--ink-2);font-size:13px}
.tbl tr:hover td{background:var(--paper)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.vcard{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--paper)}
.vcard .vh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.vcard .vh b{font-family:var(--display);font-size:18px}
.vcard .vh span{font-size:12px;color:var(--ink-2)}
.vcard table{width:100%;border-collapse:collapse;font-size:13.5px}
.vcard td{padding:2px 0}
.vcard td:first-child{color:var(--ink-3);width:38%;font-family:var(--mono);font-size:11.5px}
.vcard .frm{font-weight:700}
.vcard .foot{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--ink-2)}
.warn{color:var(--marge);font-weight:700}

.banner{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--rhodia);border:1px dashed rgba(242,107,33,.5);
  border-radius:6px;padding:3px 9px;margin-bottom:12px}
.topic.alert{border-color:rgba(224,64,95,.4);background:linear-gradient(180deg,rgba(224,64,95,.05),#fff 60%)}
.topic.alert .num{color:var(--marge)}
.topic.alert .page{border-style:solid}
.ctable{display:grid;gap:9px;margin-top:20px;max-width:470px}
.crow{display:grid;grid-template-columns:104px 1fr;align-items:center;gap:12px}
.crow label{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);letter-spacing:.04em}
.crow input{font:inherit;font-size:18px;color:var(--ink);background:transparent;border:none;
  border-bottom:2px solid var(--seyes);padding:6px 2px;width:100%}
.crow input:focus{outline:none;border-bottom-color:var(--rhodia)}
.crow.ok input{border-bottom-color:var(--juste);color:var(--juste)}
.crow.no input{border-bottom-color:var(--marge)}
/* ---------- Vokabelmodul ---------- */
.btn.sm{padding:7px 13px;font-size:13px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:22px}
.vcard2{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper);display:flex;flex-direction:column}
.vcard2 img{width:100%;height:140px;object-fit:cover;object-position:top;display:block;background:#fff}
.vmeta{padding:10px 12px 4px}
.vmeta b{display:block;font-family:var(--display);font-size:15px}
.vmeta span{font-size:12px;color:var(--ink-2)}
.vbtns{display:flex;gap:6px;padding:8px 12px 12px;margin-top:auto}

.vedit{position:relative;margin:16px 0;user-select:none;touch-action:none;line-height:0;
  border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.vedit img{width:100%;display:block;pointer-events:none}
.vshade{position:absolute;left:0;right:0;background:rgba(23,35,90,.34);pointer-events:none}
.vshade-t{top:0}.vshade-b{bottom:0}
.vline{position:absolute;background:var(--rhodia);touch-action:none}
.vline.vsplit{top:0;bottom:0;width:3px;margin-left:-1.5px;cursor:ew-resize;z-index:4}
.vline.vsplit::after{content:"";position:absolute;top:0;bottom:0;left:-15px;right:-15px}
.vline.vh,.vline.vrow{left:0;right:0;height:3px;margin-top:-1.5px;cursor:ns-resize;z-index:2}
.vline.vh{background:var(--ink)}
.vline.vh::after,.vline.vrow::after{content:"";position:absolute;left:0;right:0;top:-9px;bottom:-9px}
.vline.vrow{background:rgba(242,107,33,.85);will-change:transform}
.vtag{position:absolute;top:4px;left:6px;font-family:var(--mono);font-size:10px;line-height:1.6;
  background:var(--rhodia);color:#fff;padding:1px 6px;border-radius:4px;white-space:nowrap}
.vgrip{position:absolute;width:22px;height:22px;border-radius:50%;color:#fff;font-size:13px;line-height:22px;
  text-align:center;z-index:6;touch-action:none;cursor:pointer}
.vrot{background:var(--ink);cursor:ns-resize}
.vx{background:var(--rhodia)}

.vtag2{top:26px}
.vline.vv{top:0;bottom:0;width:3px;margin-left:-1.5px;cursor:ew-resize;background:var(--ink);z-index:3}
.vline.vv::after{content:"";position:absolute;top:0;bottom:0;left:-14px;right:-14px}
.vshade-l{left:0}.vshade-r{right:0}
.vroles{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 4px;
  background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.vroles label{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.vrole{cursor:pointer;background:#fff;border:1px solid var(--rhodia);color:var(--rhodia);border-radius:6px;
  padding:5px 12px;font-size:13px;font-weight:700}
.vrole:hover{background:rgba(242,107,33,.08)}
.vroles .vsep{color:var(--ink-3);font-family:var(--mono)}
.vroles .vsl{font-size:12px;color:var(--ink-2)}
.vsens{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 4px;
  background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.vsens label{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.vsens .vsl{font-size:12px;color:var(--ink-2)}
.vsens input[type=range]{flex:1 1 150px;min-width:120px;accent-color:var(--rhodia)}
.vsens b{font-family:var(--mono);font-size:12.5px;color:var(--rhodia);white-space:nowrap}
.vnum{font-family:var(--mono);font-size:11px;color:var(--ink-3);width:22px;text-align:right}
.vrb{display:flex;flex-direction:column;gap:4px}
.vmini{cursor:pointer;width:28px;height:26px;border:1px solid var(--line);background:#fff;border-radius:6px;
  font-size:14px;line-height:1;color:var(--ink-2)}
.vmini:hover{border-color:var(--rhodia);color:var(--rhodia)}
.vprow{display:grid;gap:8px;align-items:center;border-bottom:1px dashed var(--line);padding-bottom:5px}
.vprow.c2{grid-template-columns:22px 1fr 1fr 32px}
.vprow.c3{grid-template-columns:22px 1fr 1fr 1fr 32px}
.vpreview{display:grid;gap:5px;margin-top:14px}
.vpc{overflow:hidden;min-width:0}
.vpc canvas{max-width:100%;display:block}

.vtype{display:grid;gap:14px}
.vtrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px}
.vtc{min-width:0}
.vtc canvas{max-width:100%;display:block;margin-bottom:5px}
.vtc input{width:100%;font:inherit;font-size:15px;background:transparent;border:none;
  border-bottom:2px solid var(--seyes);padding:5px 2px}
.vtc input:focus{outline:none;border-bottom-color:var(--rhodia)}

.vshow{margin:18px 0 6px;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--paper);
  display:flex;justify-content:center;overflow:auto}
.vsolbox{margin-top:16px;padding:14px 16px;border:1px dashed var(--juste);border-radius:10px;
  background:rgba(18,133,90,.05);display:flex;flex-direction:column;gap:8px;align-items:flex-start;overflow:auto}
.vlab{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--juste)}
label.btn{display:inline-block;cursor:pointer}
@media (max-width:640px){
  .vprow.c2{grid-template-columns:20px 1fr 30px}
  .vprow.c3{grid-template-columns:20px 1fr 30px}
  .vtrow{grid-template-columns:1fr}
  .vtrow{gap:8px}
}
.progress{display:flex;align-items:center;gap:10px;margin-top:18px;font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.pbar{flex:1;height:4px;background:var(--seyes-soft);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--rhodia);width:0;transition:width .25s ease}

.foot{margin-top:44px;font-size:12.5px;color:var(--ink-3);font-family:var(--mono);text-align:center}

@media (max-width:640px){
  body{background-image:repeating-linear-gradient(to bottom, transparent 0 31px, var(--seyes) 31px 32px)}
  .wrap{padding:0 14px 80px}
  .sheet{padding:20px 18px 20px 40px}

 note:"je m'engage, nous nous engageons."}

const VMAP = {}; VERBS.forEach(v => VMAP[v.inf] = v);

/* --- Hilfsfunktionen --- */
function elide(word, pron){                 // je + ai -> j'ai
  if(pron !== "je") return pron + " " + word;
  return /^[aeiouyéèêh]/i.test(word) ? "j'" + word : "je " + word;
}
function reflPron(i, word){                 // me / te / se + Elision
  const p = ["me","te","se","nous","vous","se"][i];
  if(i<3 || i===5){ return /^[aeiouyéèêh]/i.test(word) ? p.slice(0,1)+"'"+word : p+" "+word; }
  return p + " " + word;
}
function impfStem(v){
  if(v.impf) return v.impf;
  const nous = v.pres[3] || v.pres[2];
  return nous.replace(/ons$/, "");
}
function softenStem(stem, ending){          // commenç+ions -> commencions ; mange+ions -> mangions
  if(/^i/.test(ending)){
    if(stem.endsWith("ç")) return stem.slice(0,-1)+"c";
    if(stem.endsWith("ge")) return stem.slice(0,-1);
  }
  return stem;
}
const END_IMPF = ["ais","ais","ait","ions","iez","aient"];
const END_FUT  = ["ai","as","a","ons","ez","ont"];
const END_SUBJ = ["e","es","e","ions","iez","ent"];

/* Gibt die reine Verbform (ohne Pronomen) für Person i zurück */
function rawForm(v, tense, i){
  if(v.imp && i !== 2) return null;
  switch(tense){
    case "present":   return v.pres[i];
    case "imparfait": {const s=impfStem(v); return softenStem(s,END_IMPF[i])+END_IMPF[i];}
    case "futur":     return v.fut + END_FUT[i];
    case "conditionnel": return v.fut + END_IMPF[i];
    case "subjonctif": {
      if(v.subj) return v.subj[i];
      if(i===3||i===4){const s=impfStem(v); return softenStem(s,END_SUBJ[i])+END_SUBJ[i];}
      const st = (v.pres[5]||"").replace(/ent$/,"");
      return st + END_SUBJ[i];
    }
  }
  return null;
}
/* Angleichung des Partizips bei être-Verben — als Hinweis in Klammern */
function agreeSuffix(i, aux){
  if(aux !== "être") return "";
  return (i >= 3) ? "(e)s" : "(e)";
}
function composed(v, auxTense, i){
  const auxForm = rawForm(VMAP[v.aux], auxTense, i);
  const pp = v.pp + agreeSuffix(i, v.aux);
  if(v.refl) return PRON[i] + " " + reflPron(i, auxForm + " " + pp);
  return elide(auxForm + " " + pp, PRON[i]);
}
/* Vollständige Form mit Pronomen, inkl. zusammengesetzter Zeiten */
function conj(v, tense, i){
  if(v.imp && i !== 2) return null;
  switch(tense){
    case "present": case "imparfait": case "futur": case "conditionnel": {
      const f = rawForm(v, tense, i);
      if(!f) return null;
      return v.refl ? PRON[i] + " " + reflPron(i, f) : elide(f, PRON[i]);
    }
    case "subjonctif": {
      const f = rawForm(v, tense, i);
      if(!f) return null;
      const body = v.refl ? PRON[i] + " " + reflPron(i, f) : elide(f, PRON[i]);
      return (/^[aeiouyéèêh]/i.test(body) ? "qu'" : "que ") + body;
    }
    case "passe":  return composed(v, "present", i);
    case "pqp":    return composed(v, "imparfait", i);
    case "futurc": {
      const g = rawForm(VMAP["aller"], "present", i);
      if(v.refl){
        const inf = v.inf.replace(/^s[e']\s*/, "");
        return PRON[i] + " " + g + " " + reflPron(i, inf);
      }
      return elide(g + " " + v.inf, PRON[i]);
    }
  }
  return null;
}
/* Imperativ: [tu, nous, vous] */
function imperative(v){
  if(v.noImper || v.imp) return null;
  if(v.imper) return v.imper;
  const forms = [v.pres[1], v.pres[3], v.pres[4]];
  if((v.grp==="er"||v.erImper) && forms[0] && forms[0].endsWith("s")) forms[0]=forms[0].slice(0,-1);
  if(v.refl) return [forms[0]+"-toi", forms[1]+"-nous", forms[2]+"-vous"];
  return forms;
}

const TENSES = [
  {id:"present",     label:"présent",        de:"Gegenwart"},
  {id:"passe",       label:"passé composé",  de:"vollendete Vergangenheit"},
  {id:"imparfait",   label:"imparfait",      de:"Vergangenheit (Beschreibung)"},
  {id:"futurc",      label:"futur composé",  de:"nahe Zukunft"},
  {id:"futur",       label:"futur simple",   de:"Zukunft"},
  {id:"conditionnel",label:"conditionnel",   de:"Konditional / Höflichkeit"},
  {id:"subjonctif",  label:"subjonctif",     de:"Subjonctif"},
  {id:"pqp",         label:"plus-que-parfait",de:"Vorvergangenheit"}
];

/* ============================================================
   2. ZAHLEN — Generator
   ============================================================ */
const U = ["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf",
           "dix","onze","douze","treize","quatorze","quinze","seize"];
function num99(n){
  if(n < 17) return U[n];
  if(n < 20) return "dix-" + U[n-10];
  if(n < 70){
    const t = Math.floor(n/10)*10, r = n%10;
    const T = {20:"vingt",30:"trente",40:"quarante",50:"cinquante",60:"soixante"}[t];
    if(r === 0) return T;
    if(r === 1) return T + "-et-un";
    return T + "-" + U[r];
  }
  if(n < 80){
    const r = n - 60;
    if(r === 11) return "soixante-et-onze";
    return "soixante-" + num99(r);
  }
  const r = n - 80;
  if(r === 0) return "quatre-vingts";
  return "quatre-vingt-" + num99(r);
}
function numFR(n){
  if(n === 0) return "zéro";
  if(n < 100) return num99(n);
  if(n < 1000){
    const h = Math.floor(n/100), r = n%100;
    let head = (h === 1) ? "cent" : num99(h) + "-cent";
    if(r === 0) return head + (h > 1 ? "s" : "");
    return head + "-" + num99(r);
  }
  if(n < 1000000){
    const th = Math.floor(n/1000), r = n%1000;
    let head = (th === 1) ? "mille" : numFR(th) + "-mille";
    return r === 0 ? head : head + "-" + numFR(r);
  }
  const m = Math.floor(n/1000000), r = n%1000000;
  let head = numFR(m) + "-million" + (m > 1 ? "s" : "");
  return r === 0 ? head : head + "-" + numFR(r);
}
function ordinalFR(n){
  if(n === 1) return "premier";
  let b = numFR(n).replace(/ts$/, "t");     // quatre-vingts / deux-cents -> ohne -s
  if(/cinq$/.test(b))      b += "u";        // cinquième
  else if(/neuf$/.test(b)) b = b.slice(0,-1) + "v";  // neuvième
  else if(/e$/.test(b))    b = b.slice(0,-1);        // quatre -> quatrième
  return b + "ième";
}

function verbCard(v){
  const imp = imperative(v);

                      .filter(Boolean).join("");
  rows.push(`<tr><td>imparfait</td><td class="frm">${conj(v,"imparfait",v.imp?2:0)}</td></tr>`);
  rows.push(`<tr><td>subjonctif</td><td class="frm">${conj(v,"subjonctif",v.imp?2:0)}</td></tr>`);
  rows.push(`<tr><td>futur</td><td class="frm">${conj(v,"futur",v.imp?2:0)}</td></tr>`);
  rows.push(`<tr><td>conditionnel</td><td class="frm">${conj(v,"conditionnel",v.imp?2:0)}</td></tr>`);
  rows.push(`<tr><td>passé composé</td><td class="frm">${conj(v,"passe",v.imp?2:0)}</td></tr>`);
  if(imp) rows.push(`<tr><td>impératif</td><td class="frm">${imp.join(" ! ")} !</td></tr>`);
  return `<div class="vcard">
    <div class="vh"><b>${v.inf}</b><span>${v.de}</span></div>
    <table><tbody>${pres}${rows.join("")}</tbody></table>
    ${v.aux==="être" ? '<div class="foot"><span class="warn">être-Verb</span> im passé composé — Partizip angleichen.</div>' : ""}
    ${v.note ? `<div class="foot">${v.note}</div>` : ""}
  </div>`;
}

<p>Man nimmt den Infinitiv und schneidet die letzten zwei Buchstaben ab. Was übrig bleibt, ist der Stamm.</p>
<div class="ex">regard<b>er</b> → Stamm <b>regard-</b> · fin<b>ir</b> → Stamm <b>fin-</b> · attend<b>re</b> → Stamm <b>attend-</b></div>
<p>Genau darum unterscheidet man drei Gruppen: -er, -ir und -re. Die Gruppe entscheidet, welche Endungen drankommen.</p>

<h3>Das Präsens</h3>
<ol class="steps">
<li>Stamm abschneiden (siehe oben).</li>
<li>Endung der Gruppe anhängen:
<table class="tbl">
<tr><th></th><th>-er (regarder)</th><th>-re (attendre)</th><th>-ir (finir)</th><th>-ir (sortir)</th></tr>
<tr><td>je</td><td class="fr">-e</td><td class="fr">-s</td><td class="fr">-is</td><td class="fr">-s</td></tr>
<tr><td>tu</td><td class="fr">-es</td><td class="fr">-s</td><td class="fr">-is</td><td class="fr">-s</td></tr>
<tr><td>il/elle/on</td><td class="fr">-e</td><td class="fr">—</td><td class="fr">-it</td><td class="fr">-t</td></tr>
<tr><td>nous</td><td class="fr">-ons</td><td class="fr">-ons</td><td class="fr">-issons</td><td class="fr">-ons</td></tr>
<tr><td>vous</td><td class="fr">-ez</td><td class="fr">-ez</td><td class="fr">-issez</td><td class="fr">-ez</td></tr>
<tr><td>ils/elles</td><td class="fr">-ent</td><td class="fr">-ent</td><td class="fr">-issent</td><td class="fr">-ent</td></tr>
</table></li>
</ol>
<div class="rule"><b>Warum zwei Sorten -ir-Verben?</b> Bei <i>finir</i> schiebt sich im Plural ein <b>-iss-</b> dazwischen
(nous fin<b>iss</b>ons), bei <i>sortir</i> nicht (nous sortons). Das muss man pro Verb mitlernen — <i>finir, choisir, grandir,
réagir, réussir</i> gehören zur ersten Sorte, <i>sortir, partir, dormir, sentir</i> zur zweiten.</div>
<div class="rule"><b>Hörtipp:</b> je, tu, il und ils klingen bei den -er-Verben alle gleich (je regarde = ils regardent).
Nur nous und vous hört man wirklich heraus. Beim Schreiben zählt aber jeder Buchstabe.</div>

<h3>Das passé composé — die abgeschlossene Vergangenheit</h3>
<p>Es besteht aus zwei Wörtern, genau wie das deutsche Perfekt („ich <u>habe</u> ge<u>macht</u>“).</p>
<ol class="steps">
<li><b>Hilfsverb wählen:</b> fast immer <b>avoir</b>. <b>être</b> nur bei den 13 Bewegungs- und Zustandsverben
(aller, arriver, descendre, devenir, entrer, monter, partir, rentrer, rester, retourner, sortir, tomber, venir)
und bei allen reflexiven Verben.</li>
<li><b>Hilfsverb im Präsens konjugieren:</b> j'ai / je suis, tu as / tu es …</li>
<li><b>Partizip bilden:</b> -er → <b>-é</b> (regardé) · -ir → <b>-i</b> (fini) · -re → <b>-u</b> (attendu).
Unregelmäßige muss man lernen: fait, dit, pris, mis, vu, lu, eu, été, écrit, ouvert, offert, venu, voulu, pu, dû, su.</li>
<li><b>Nur bei être:</b> das Partizip ans Subjekt angleichen — wie ein Adjektiv.
elle est allé<b>e</b>, ils sont allé<b>s</b>, elles sont allé<b>es</b>.</li>
</ol>
<div class="ex">j' <b>ai</b> regard<b>é</b> un film. · elle <b>est</b> parti<b>e</b> à huit heures.</div>

<h3>Der imparfait — die beschreibende Vergangenheit</h3>
<p>Hier gibt es genau <b>eine</b> Regel, und sie gilt für jedes Verb außer <i>être</i>.</p>
<ol class="steps">
<li>Verb im Präsens in die <b>nous-Form</b> setzen: <i>faire</i> → nous <b>faisons</b>.</li>
<li><b>-ons</b> abschneiden: <b>fais-</b></li>
<li>Endung anhängen: <b>-ais, -ais, -ait, -ions, -iez, -aient</b> → je faisais, nous faisions.</li>
</ol>
<div class="ex">prendre → nous pren<b>ons</b> → je <b>prenais</b> · finir → nous fin<b>issons</b> → je <b>finissais</b></div>
<div class="rule"><b>Einzige Ausnahme:</b> être → j'<b>étais</b>. Und: -ais, -ait, -aient klingen alle gleich [ɛ] —
welches man schreibt, entscheidet nur das Subjekt.</div>

<h3>Das futur simple — die Zukunft</h3>
<ol class="steps">
<li><b>Futurstamm:</b> der ganze Infinitiv. Bei -re-Verben fällt das e weg: attendre → <b>attendr-</b>.
Der Stamm endet <b>immer</b> auf -r, das ist der Erkennungston der Zukunft.</li>
<li>Endungen anhängen — das sind genau die Präsensformen von <i>avoir</i>: <b>-ai, -as, -a, -ons, -ez, -ont</b>.</li>
</ol>
<div class="ex">parler → je parler<b>ai</b> · attendre → tu attendr<b>as</b> · finir → ils finir<b>ont</b></div>
<p>Etwa ein Dutzend Verben hat einen eigenen Stamm, den Rest der Regel ändert das nicht:
aur-, ser-, ir-, fer-, viendr-, pourr-, devr-, saur-, voudr-, verr-, faudr-, courr-, enverr-.</p>

<h3>Der conditionnel — die Höflichkeitsform</h3>
<div class="rule">Futurstamm + imparfait-Endungen. Mehr ist es nicht.<br>
je voudr<b>ais</b> (statt je veux), j'aimer<b>ais</b>, ce ser<b>ait</b> possible.<br>
<b>Verwechslungsgefahr:</b> je parler<b>ai</b> = ich werde sprechen · je parler<b>ais</b> = ich würde sprechen.
Ein einziger Buchstabe.</div>

<h3>Der subjonctif</h3>
<ol class="steps">
<li>Verb im Präsens in die <b>ils-Form</b> setzen: <i>prendre</i> → ils <b>prennent</b>.</li>
<li><b>-ent</b> abschneiden: <b>prenn-</b></li>
<li>Endungen: <b>-e, -es, -e, -ions, -iez, -ent</b> → que je prenne, qu'ils prennent.</li>
<li><b>Achtung bei nous und vous:</b> die sehen aus wie der imparfait — que nous <b>prenions</b>, que vous <b>preniez</b>.
Genau dort passieren die meisten Fehler.</li>
</ol>
<p>Eigene Stämme haben nur: être (sois), avoir (aie), aller (aille), faire (fasse), pouvoir (puisse),
savoir (sache), vouloir (veuille), falloir (faille).</p>

<h3>Der Imperativ</h3>
<div class="rule">Man nimmt die Präsensformen von tu, nous und vous und lässt das Subjektpronomen weg.<br>
Bei -er-Verben (und bei ouvrir, offrir, aller) fällt beim <b>tu</b> das -s weg: tu regardes → <b>Regarde !</b> · <b>Va !</b><br>
Reflexiv: das Pronomen rutscht nach hinten und me wird zu toi — <b>Lève-toi !</b>, verneint aber wieder nach vorn: <b>Ne te lève pas !</b></div>

<h3>Die reflexiven Verben</h3>
<p>Sie haben ein zweites Pronomen, das sich mitverändert und immer <b>vor</b> dem Verb steht:</p>
<div class="ex">je <b>me</b> couche · tu <b>te</b> couches · il <b>se</b> couche · nous <b>nous</b> couchons · vous <b>vous</b> couchez · ils <b>se</b> couchent</div>
<p>Vor einem Vokal wird me/te/se zu m'/t'/s' (je m'entraîne). Im passé composé immer mit être:
je me suis couché(e). Und im Infinitiv passt sich das Pronomen an: je vais <b>me</b> coucher, nous allons <b>nous</b> coucher.</p>

<h3>Warum manche -er-Verben die Schreibung ändern</h3>
<p>Nicht aus Bosheit, sondern damit die Aussprache stimmt. Drei Muster:</p>
<table class="tbl">
<tr><td class="fr">c → ç · g → ge</td><td>vor a und o, damit c und g weich bleiben: nous commen<b>ç</b>ons, nous man<b>ge</b>ons.
Vor i und e passiert nichts: nous commencions.</td></tr>
<tr><td class="fr">e → è · é → è</td><td>wenn die Endung stumm ist, braucht die Silbe davor den offenen Klang:
j'ach<b>è</b>te, je préf<b>è</b>re — aber nous achetons, nous préférons (dort ist die Endung hörbar).</td></tr>
<tr><td class="fr">Doppelkonsonant</td><td>gleicher Grund, andere Lösung: j'appe<b>ll</b>e, je je<b>tt</b>e — aber nous appelons, nous jetons.</td></tr>
</table>
<div class="rule"><b>Faustregel:</b> Die Änderung passiert immer in den vier „stummen“ Formen (je, tu, il, ils) —
nous und vous bleiben brav wie der Infinitiv.</div>`;

EXPL.verbpraep = () => `
<p class="lead">Hier gibt es nichts abzuleiten — aber es gibt ein System, wie man es sich merkt und wofür man es braucht.</p>

<h3>Was à und de hier überhaupt bedeuten</h3>
<p>In diesen Ausdrücken sind à und de <b>keine</b> Wörter mit eigener Bedeutung mehr. Sie gehören fest zum Verb,
so wie im Deutschen „warten <u>auf</u>“ oder „sich freuen <u>über</u>“. Deshalb hilft die Übersetzung meistens nicht:
<i>téléphoner <b>à</b> qn</i> heißt „jdn anrufen“ — von „an“ ist im Deutschen nichts zu sehen.</p>
<div class="rule"><b>Deshalb gilt:</b> Ein Verb nie allein lernen, sondern immer mit seiner Präposition und den Kürzeln.
<b>qn</b> = quelqu'un (jemand), <b>qc</b> = quelque chose (etwas). <i>parler à qn</i> und <i>parler de qc</i> sind zwei
verschiedene Vokabeln.</div>

<h3>Direktes oder indirektes Objekt — der Unterschied</h3>
<ol class="steps">
<li><b>Direktes Objekt:</b> steht ohne Präposition direkt hinter dem Verb. <i>Je vois <b>Paul</b>.</i></li>
<li><b>Indirektes Objekt:</b> hängt über à oder de am Verb. <i>Je téléphone <b>à Paul</b>.</i></li>
</ol>
<p>Das ist kein Selbstzweck — davon hängt ab, welches Pronomen du später einsetzt:</p>
<table class="tbl">
<tr><td>direkt</td><td class="fr">le / la / les</td><td>Je vois Paul → Je <b>le</b> vois.</td></tr>
<tr><td>indirekt mit à + Person</td><td class="fr">lui / leur</td><td>Je téléphone à Paul → Je <b>lui</b> téléphone.</td></tr>
<tr><td>à + Sache</td><td class="fr">y</td><td>Je pense à mon test → J'<b>y</b> pense.</td></tr>
<tr><td>de + Sache</td><td class="fr">en</td><td>Je parle de mon test → J'<b>en</b> parle.</td></tr>
</table>

<h3>Zwei Objekte im selben Satz</h3>
<p>Viele Verben verlangen beides gleichzeitig — <b>qc à qn</b>: eine Sache und eine Person.</p>
<div class="ex">Je donne <b>le livre</b> (was?) <b>à Marie</b> (wem?). → Je <b>le lui</b> donne.</div>
<p>Im Deutschen ist das der Dativ: jdm etwas geben, zeigen, erklären, leihen, schenken, schicken.
Wenn du im Deutschen „wem?“ fragen kannst, steht im Französischen fast immer <b>à</b>.</p>

<h3>Die drei Klassiker, die im Test drankommen</h3>
<div class="rule"><b>1. manquer à qn</b> — dreht sich um. Wer im Deutschen fehlt, ist im Französischen das Subjekt:
<i>Tu me manques</i> = Du fehlst mir. Wörtlich: „Du fehlst zu mir.“<br><br>
<b>2. jouer de / jouer à</b> — <i>de</i> für Instrumente (jouer <b>du</b> piano), <i>à</i> für Spiele und Sport (jouer <b>au</b> foot).
Merkhilfe: Ein Instrument macht Töne <i>aus</i> sich heraus (de), bei einem Spiel macht man mit (à).<br><br>
<b>3. emprunter qc à qn</b> — sich etwas <i>bei</i> jdm ausleihen, aber mit <b>à</b>. Das Gegenstück <i>prêter qc à qn</i>
(jdm etwas leihen) hat dieselbe Präposition — nur die Richtung ist umgekehrt.</div>

<h3>Verben mit Infinitivergänzung</h3>
<p>Wenn nach dem Verb ein zweites Verb im Infinitiv folgt, gibt es drei Möglichkeiten:</p>
<table class="tbl">
<tr><td class="fr">ohne alles</td><td>nach vouloir, pouvoir, devoir, aller, aimer, préférer, savoir, falloir<br><i>Je veux partir. · Il faut partir.</i></td></tr>
<tr><td class="fr">mit de</td><td>décider, essayer, oublier, refuser, accepter, avoir envie, être content/e<br><i>J'ai décidé <b>de</b> partir.</i></td></tr>
<tr><td class="fr">mit à</td><td>commencer, continuer, apprendre, réussir, arriver, aider qn, obliger qn<br><i>Je commence <b>à</b> comprendre.</i></td></tr>
</table>
<div class="rule"><b>Grobe Tendenz</b> (kein Gesetz, aber sie hilft): <b>à</b> steht oft, wenn etwas anfängt, weitergeht oder
angestrebt wird — <b>de</b> oft, wenn etwas beendet, entschieden oder abgelehnt wird.</div>`;

EXPL.zeiten = () => `
<p class="lead">Französisch hat für Vergangenheit zwei Zeiten, wo Deutsch nur eine hat. Genau da entscheidet sich
die Note — der Rest ist Baukasten.</p>

<h3>Die Grundfrage: Foto oder Film?</h3>
<p>Stell dir vor, du erzählst von gestern. Zwei Sorten Sätze kommen vor:</p>
<table class="tbl">
<tr><th>imparfait — der Hintergrund</th><th>passé composé — das Ereignis</th></tr>
<tr><td>Wie war es? Wetter, Stimmung, Aussehen, Alter, Gefühle</td><td>Was ist passiert? Eine Handlung, die anfängt und aufhört</td></tr>
<tr><td>Was passierte immer wieder? (Gewohnheit)</td><td>Was passierte einmal, an einem Punkt?</td></tr>
<tr><td>Was lief gerade, als etwas anderes passierte?</td><td>Was hat das Laufende unterbrochen?</td></tr>
<tr><td>souvent, toujours, tous les jours, chaque, avant, quand j'étais petit</td><td>hier, soudain, tout à coup, une fois, à ce moment-là, puis</td></tr>
</table>
<div class="ex">Il <b>faisait</b> beau et je <b>me promenais</b> dans le parc <span style="color:var(--ink-3)">(Kulisse — imparfait)</span>,
quand soudain j'<b>ai vu</b> mon prof <span style="color:var(--ink-3)">(Ereignis — passé composé)</span>.</div>
<div class="rule"><b>Testfrage:</b> Kannst du im Deutschen „gerade“ oder „immer“ einfügen, ohne dass der Satz komisch wird?
Dann imparfait. Passt eher „dann“ oder „plötzlich“? Dann passé composé.</div>

<h3>Das plus-que-parfait — noch eine Stufe zurück</h3>
<ol class="steps">
<li>Hilfsverb (avoir oder être — dieselbe Wahl wie beim passé composé) in den <b>imparfait</b> setzen: j'<b>avais</b>, j'<b>étais</b>.</li>
<li>Partizip anhängen, bei être angleichen.</li>
</ol>
<div class="ex">Quand je suis arrivé, ils <b>avaient</b> déjà <b>mangé</b>. — Erst haben sie gegessen, <i>dann</i> kam ich.</div>

<h3>Zwei Zukünfte — welche wann?</h3>
<table class="tbl">
<tr><td class="fr">futur composé<br>aller + Infinitiv</td><td>nah, konkret, gesprochen. Wie im Deutschen „ich gehe gleich einkaufen“.<br><i>Je <b>vais</b> partir.</i></td></tr>
<tr><td class="fr">futur simple<br>Stamm + ai, as, a, ons, ez, ont</td><td>weiter weg, geschrieben, Vorhersagen und Versprechen.<br><i>Je <b>partirai</b> demain.</i></td></tr>
</table>
<p>Beides ist meistens nicht falsch — im Aufsatz wirkt das futur simple erwachsener.</p>

<h3>Die si-Sätze — feste Paare</h3>
<ol class="steps">
<li><b>Realer Fall</b> (kann gut passieren): si + <b>présent</b> → Hauptsatz im <b>futur</b>.<br>
<i>Si tu viens, je serai content.</i> — Wenn du kommst, werde ich mich freuen.</li>
<li><b>Irrealer Fall</b> (eher hypothetisch): si + <b>imparfait</b> → Hauptsatz im <b>conditionnel</b>.<br>
<i>Si tu venais, je serais content.</i> — Wenn du kämst, würde ich mich freuen.</li>
</ol>
<div class="rule"><b>Die eine Regel, die man nie brechen darf:</b> Direkt nach <i>si</i> steht nie ein futur und nie ein
conditionnel. Kein „si je serai“, kein „si je serais“. Die Zukunft steckt im anderen Satzteil.
(Ausnahme: <i>si</i> im Sinn von „ob“ — <i>Je ne sais pas si je viendrai.</i>)</div>

<h3>Wann subjonctif — und warum überhaupt?</h3>
<p>Der subjonctif steht nie allein, sondern immer nach einem <b>que</b>, das von einem bestimmten Ausdruck ausgelöst wird.
Gemeinsam ist diesen Ausdrücken: Es geht nicht um eine Tatsache, sondern darum, wie jemand dazu <i>steht</i>.</p>
<table class="tbl">
<tr><td>Wunsch und Wille</td><td class="fr">je voudrais que, je veux que, je ne veux pas que</td></tr>
<tr><td>Gefühl und Bewertung</td><td class="fr">je suis content/e que, je n'aime pas que, je trouve (ne) normal que</td></tr>
<tr><td>Notwendigkeit und Möglichkeit</td><td class="fr">il faut que, il est important que, il est possible que</td></tr>
<tr><td>bestimmte Bindewörter</td><td class="fr">bien que, pour que, avant que, à condition que</td></tr>
</table>
<div class="rule"><b>Wichtig:</b> Nur wenn zwei <b>verschiedene</b> Subjekte im Spiel sind.
Bei gleichem Subjekt nimmt man den Infinitiv: <i>Je veux <b>partir</b></i> (ich will selbst) vs.
<i>Je veux que tu <b>partes</b></i> (ich will, dass du gehst).</div>

<h3>Der gérondif — „indem / während“</h3>
<ol class="steps">
<li>Verb in die <b>nous-Form</b> des Präsens setzen: nous <b>regardons</b>.</li>
<li><b>-ons</b> abschneiden, <b>-ant</b> anhängen: <b>regardant</b>.</li>
<li><b>en</b> davorsetzen: <b>en regardant</b>.</li>
</ol>
<div class="ex">Elle apprend le français <b>en regardant</b> des séries. — Sie lernt Französisch, indem sie Serien schaut.</div>
<p>Unregelmäßig sind nur drei: en <b>étant</b>, en <b>ayant</b>, en <b>sachant</b>.
Und: Beide Handlungen müssen dieselbe Person betreffen.</p>`;

EXPL.zahlen = () => `
<p class="lead">Die französischen Zahlen wirken chaotisch, folgen aber vier Bauprinzipien. Wer die kennt,
muss nur bis 16 auswendig lernen.</p>

<h3>Baustein 1: 0 bis 16 — auswendig</h3>
<p>zéro, un, deux, trois, quatre, cinq, six, sept, huit, neuf, dix, onze, douze, treize, quatorze, quinze, seize.
Danach hört das Auswendiglernen auf.</p>

<h3>Baustein 2: 17 bis 19 — zusammenzählen</h3>
<div class="ex">10 + 7 = <b>dix-sept</b> · 10 + 8 = <b>dix-huit</b> · 10 + 9 = <b>dix-neuf</b></div>

<h3>Baustein 3: Zehner + Einer</h3>
<p>Die Zehner 20 bis 60 sind eigene Wörter (vingt, trente, quarante, cinquante, soixante). Dahinter hängt man den Einer:</p>
<div class="ex">vingt-deux · trente-quatre · cinquante-neuf</div>
<p>Nur bei der <b>1</b> schiebt sich ein <b>et</b> dazwischen — als hätte man „zwanzig <i>und</i> eins“ gesagt:</p>
<div class="ex">21 vingt-<b>et</b>-un · 31 trente-<b>et</b>-un · 41, 51, 61 genauso · 71 soixante-<b>et</b>-onze</div>

<h3>Baustein 4: 70, 80, 90 — hier wird gerechnet</h3>
<p>Für 70, 80 und 90 gibt es keine eigenen Wörter. Französisch rechnet stattdessen:</p>
<table class="tbl">
<tr><td class="fr">70 = 60 + 10</td><td>soixante-dix. Dann weiter mit 11, 12, 13 …: 71 soixante-et-onze, 72 soixante-douze, 77 soixante-dix-sept.</td></tr>
<tr><td class="fr">80 = 4 × 20</td><td>quatre-vingts. Dann weiter mit 1, 2, 3 …: 81 quatre-vingt-un, 82 quatre-vingt-deux.</td></tr>
<tr><td class="fr">90 = 4 × 20 + 10</td><td>quatre-vingt-dix. Dann weiter mit 11, 12 …: 91 quatre-vingt-onze, 99 quatre-vingt-dix-neuf.</td></tr>
</table>
<div class="rule"><b>Die Denkweise:</b> Ab 70 zählst du nicht in Einern weiter, sondern hängst die kompletten Zahlen
10 bis 19 an. 77 ist also nicht „70 + 7“, sondern „60 + 17“.<br>
<b>Warum kein et bei 81 und 91?</b> Weil dort keine echte 1 steht, sondern der Rest einer Rechnung.
et gibt es nur bei 21, 31, 41, 51, 61 und 71.</div>

<h3>Hunderter und Tausender</h3>
<ol class="steps">
<li>Anzahl davorsetzen — bei 100 und 1000 lässt man die 1 weg: <b>cent</b>, <b>mille</b> (nicht „un cent“).</li>
<li>Rest anhängen: 101 cent-un · 250 deux-cent-cinquante · 1950 mille-neuf-cent-cinquante.</li>
<li><b>-s</b> bei cent und vingt nur, wenn nichts mehr folgt: deux-cent<b>s</b>, quatre-vingt<b>s</b> — aber deux-cent-un, quatre-vingt-un.</li>
<li><b>mille</b> bekommt nie ein -s: deux-mille.</li>
</ol>

<h3>Jahreszahlen, Kommazahlen, Millionen</h3>
<table class="tbl">
<tr><td>Jahr</td><td class="fr">1950 = mille-neuf-cent-cinquante</td><td>Anders als im Deutschen sagt man nicht „neunzehnhundert…“, sondern liest die ganze Zahl.</td></tr>
<tr><td>Komma</td><td class="fr">1,7 = un virgule sept</td><td>Das Komma heißt <i>virgule</i>. Französisch trennt Dezimalstellen wie Deutsch mit Komma.</td></tr>
<tr><td>Million</td><td class="fr">2 000 000 d'habitants</td><td>Nach million/milliard steht immer <b>de</b>: deux-millions <b>d'</b>habitants.</td></tr>
</table>

<h3>Die Ordnungszahlen</h3>
<ol class="steps">
<li>Nur die 1 hat eine eigene Form: <b>premier / première</b>.</li>
<li>Ab 2: Grundzahl + <b>-ième</b> — deuxième, troisième, dixième, vingtième.</li>
<li>Drei kleine Anpassungen: endet die Zahl auf -e, fällt es weg (quatre → quatr<b>ième</b>);
cinq bekommt ein u (cinq<b>u</b>ième); neuf wird zu neu<b>v</b>ième.</li>
<li>Bei zusammengesetzten Zahlen zählt nur das letzte Wort: 21. = vingt-et-un<b>ième</b>.</li>
</ol>
<p>Kurzschreibung: 1<sup>er</sup> (männlich), 1<sup>ère</sup> (weiblich), ab dann 2<sup>e</sup>, 3<sup>e</sup>, 10<sup>e</sup>.</p>`;

EXPL.praep = () => `
<p class="lead">Präpositionen sind winzig und entscheiden trotzdem über den ganzen Satz. Am schnellsten kommt man
weiter, wenn man ihre <b>Grundbedeutung</b> versteht und die paar festen Regeln lernt.</p>

<h3>à und de — die zwei Arbeitspferde</h3>
<table class="tbl">
<tr><td class="fr">à</td><td><b>Ziel und Ort:</b> wohin, wo, wem, wann. <i>Je vais à Paris. Je suis à la maison. À huit heures.</i></td></tr>
<tr><td class="fr">de</td><td><b>Herkunft und Zugehörigkeit:</b> woher, von wem, wovon. <i>Je viens de Lyon. Le vélo de Paul.</i></td></tr>
</table>

<h3>Warum aus à le plötzlich au wird</h3>
<p>Französisch mag zwei aufeinanderfolgende Vokale nicht. Deshalb verschmelzen à und de mit den Artikeln <i>le</i> und <i>les</i>:</p>
<table class="tbl">
<tr><th></th><th>+ le</th><th>+ la</th><th>+ l'</th><th>+ les</th></tr>
<tr><td class="fr">à</td><td class="fr">au</td><td>à la</td><td>à l'</td><td class="fr">aux</td></tr>
<tr><td class="fr">de</td><td class="fr">du</td><td>de la</td><td>de l'</td><td class="fr">des</td></tr>
</table>
<div class="rule">Bei <b>la</b> und <b>l'</b> passiert nichts — dort steht schon ein anderer Laut im Weg.
Das ist keine Ausnahme, sondern reine Aussprache-Bequemlichkeit.</div>

<h3>Länder: en, au oder aux?</h3>
<ol class="steps">
<li><b>Geschlecht bestimmen.</b> Endet der Ländername auf <b>-e</b>, ist er fast immer weiblich
(la France, l'Allemagne, la Suisse, l'Italie). Ausnahme: le Mexique.</li>
<li>Weiblich oder mit Vokal am Anfang → <b>en</b>: en France, en Allemagne, en Iran.</li>
<li>Männlich → <b>au</b>: au Portugal, au Maroc, au Japon, au Canada.</li>
<li>Plural → <b>aux</b>: aux Pays-Bas, aux États-Unis.</li>
<li>Städte → einfach <b>à</b>: à Paris, à Berlin, à Löhne.</li>
</ol>
<p>Für „woher“ tauscht man nur die Präposition: <b>de</b> France, <b>du</b> Portugal, <b>des</b> États-Unis, <b>de</b> Paris.</p>

<h3>Zeitangaben: der Entscheidungsbaum</h3>
<ol class="steps">
<li>Läuft es <b>bis jetzt</b> noch? → <b>depuis</b> + Präsens. <i>J'habite ici depuis trois ans.</i>
(Deutsch steht hier ein Perfekt — Französisch nicht!)</li>
<li>Ist es <b>vorbei</b> und du nennst den Zeitpunkt? → <b>il y a</b>. <i>Je suis arrivé il y a deux jours.</i></li>
<li>Ist es <b>vorbei</b> und du nennst die Dauer? → <b>pendant</b>. <i>J'ai lu pendant deux heures.</i></li>
<li>Liegt es in der <b>Zukunft</b>? → <b>dans</b>. <i>Le train part dans dix minutes.</i></li>
<li>Geplante Dauer in der Zukunft? → <b>pour</b>. <i>Je pars pour une semaine.</i></li>
</ol>
<div class="rule"><b>Die drei, die am häufigsten verwechselt werden:</b><br>
<i>depuis deux heures</i> = seit zwei Stunden (läuft noch) ·
<i>il y a deux heures</i> = vor zwei Stunden ·
<i>pendant deux heures</i> = zwei Stunden lang (vorbei)</div>

<h3>Verkehrsmittel: en oder à?</h3>
<div class="rule">Sitzt du <b>drin</b>, steht <b>en</b>: en voiture, en train, en bus, en avion, en métro.<br>
Sitzt du <b>drauf</b> oder gehst du, steht <b>à</b>: à pied, à vélo, à moto, à cheval.</div>

<h3>Kleine Wörter, die den Text erst gut machen</h3>
<p>Im Aufsatz zählt weniger, wie viele Vokabeln du kennst, sondern ob die Sätze verbunden sind. Diese acht reichen weit:</p>
<table class="tbl">
<tr><td class="fr">d'abord … ensuite … enfin</td><td>zuerst … danach … schließlich (Reihenfolge)</td></tr>
<tr><td class="fr">parce que / car</td><td>weil / denn (car verbindet zwei Hauptsätze)</td></tr>
<tr><td class="fr">donc / alors</td><td>also, deshalb (Folge)</td></tr>
<tr><td class="fr">mais / pourtant / par contre</td><td>aber / trotzdem / dagegen (Gegensatz)</td></tr>
<tr><td class="fr">en plus / surtout</td><td>außerdem / vor allem (Steigerung)</td></tr>
<tr><td class="fr">par exemple</td><td>zum Beispiel (Beleg)</td></tr>
<tr><td class="fr">à mon avis / selon moi</td><td>meiner Meinung nach (Position)</td></tr>
<tr><td class="fr">grâce à / à cause de</td><td>dank (positiv) / wegen (negativ)</td></tr>
</table>`;

EXPL.pronomen = () => `
<p class="lead">Pronomen ersetzen etwas, das schon bekannt ist. Die ganze Schwierigkeit besteht aus zwei Fragen:
<b>welches</b> Pronomen — und <b>wohin</b> damit.</p>

<h3>Frage 1: Welches Pronomen?</h3>
<p>Schau nicht auf das Deutsche, sondern auf das <b>französische Verb</b> und darauf, was dahinter steht:</p>
<ol class="steps">
<li>Steht das Objekt <b>direkt</b> hinter dem Verb, ohne Präposition? → <b>le, la, les</b><br>
<i>Je vois Paul → Je <b>le</b> vois.</i> · <i>Je regarde la télé → Je <b>la</b> regarde.</i></li>
<li>Steht <b>à + Person</b>? → <b>lui</b> (einer) oder <b>leur</b> (mehrere)<br>
<i>Je téléphone à Paul → Je <b>lui</b> téléphone.</i> · <i>Je parle à mes amis → Je <b>leur</b> parle.</i></li>
<li>Steht <b>à + Sache</b> oder ein Ort? → <b>y</b><br>
<i>Je pense à mon test → J'<b>y</b> pense.</i> · <i>Je vais à Paris → J'<b>y</b> vais.</i></li>
<li>Steht <b>de + Sache</b> oder eine Menge? → <b>en</b><br>
<i>Je parle de mes vacances → J'<b>en</b> parle.</i> · <i>J'ai deux frères → J'<b>en</b> ai deux.</i></li>
<li>Steht eine <b>Präposition + Person</b> (avec, pour, chez, sans, à cause de)? → betontes Pronomen
<b>moi, toi, lui, elle, nous, vous, eux, elles</b><br>
<i>Je pars avec <b>eux</b>. · C'est pour <b>toi</b>.</i></li>
</ol>
<div class="rule"><b>Der häufigste Fehler:</b> le/la/les auch dann zu nehmen, wenn im Französischen à steht.
Deutsch „ich rufe <u>ihn</u> an“ klingt nach direktem Objekt — französisch heißt es aber <i>téléphoner <b>à</b> qn</i>,
also <b>je lui téléphone</b>. Deshalb lohnt sich das Thema „Verben mit Präposition“ doppelt.</div>

<h3>Frage 2: Wohin mit dem Pronomen?</h3>
<p>Die Grundregel ist einfacher als im Deutschen: <b>vor das konjugierte Verb</b>. Immer.</p>
<table class="tbl">
<tr><td>einfaches Verb</td><td class="fr">Je <b>le</b> vois.</td></tr>
<tr><td>Verneinung — ne umschließt Pronomen + Verb</td><td class="fr">Je ne <b>le</b> vois pas.</td></tr>
<tr><td>passé composé — vor das Hilfsverb</td><td class="fr">Je <b>l'</b>ai vu. / Je ne <b>l'</b>ai pas vu.</td></tr>
<tr><td>mit Infinitiv — vor den Infinitiv, denn der ist gemeint</td><td class="fr">Je vais <b>le</b> voir.</td></tr>
<tr><td>bejahter Imperativ — die einzige Ausnahme: hinten mit Bindestrich</td><td class="fr">Regarde-<b>le</b> ! Donne-<b>moi</b> ça !</td></tr>
<tr><td>verneinter Imperativ — wieder normal nach vorn</td><td class="fr">Ne <b>le</b> regarde pas !</td></tr>
</table>

<h3>Zwei Pronomen gleichzeitig</h3>
<p>Dann gilt eine feste Reihenfolge — nicht die logische, sondern diese:</p>
<div class="ex"><b>me / te / se / nous / vous</b> → <b>le / la / les</b> → <b>lui / leur</b> → <b>y</b> → <b>en</b></div>
<div class="ex">Il <b>me le</b> donne. · Je <b>le lui</b> explique. · Il <b>y en</b> a trois.</div>
<p>Merkhilfe: erst die Personen, die mit Buchstaben-Doppelung anfangen (me, te, se), dann die Sachen, dann lui/leur,
und y und en machen immer den Schluss.</p>

<h3>Die Angleichung im passé composé</h3>
<ol class="steps">
<li>Steht ein <b>direktes</b> Objekt <b>vor</b> dem Verb?</li>
<li>Dann bekommt das Partizip die Endung des Objekts — wie ein Adjektiv.</li>
</ol>
<div class="ex">Les films ? Je <b>les</b> ai vu<b>s</b>. · La lettre ? Je <b>l'</b>ai écrit<b>e</b>.</div>
<p>Bei <b>lui/leur</b> (indirekt) passiert nichts: <i>Je leur ai parlé.</i> Und bei être-Verben gleicht man
sowieso ans Subjekt an.</p>

<h3>Relativpronomen: qui, que, où, dont</h3>
<p>Sie verbinden zwei Sätze zu einem. Welches du brauchst, hängt davon ab, welche Rolle das Wort im <b>Nebensatz</b> spielt:</p>
<ol class="steps">
<li>Fehlt im Nebensatz das <b>Subjekt</b>? → <b>qui</b>. Test: Nach qui kommt sofort ein Verb.<br>
<i>C'est un ami <b>qui</b> habite à Lyon.</i></li>
<li>Fehlt das <b>direkte Objekt</b>? → <b>que</b>. Test: Nach que kommt ein Subjekt.<br>
<i>C'est le film <b>que</b> j'ai vu.</i></li>
<li>Geht es um <b>Ort oder Zeit</b>? → <b>où</b>.<br>
<i>La ville <b>où</b> je suis né · le jour <b>où</b> tu es parti</i></li>
<li>Verlangt das Verb im Nebensatz ein <b>de</b>? → <b>dont</b>.<br>
<i>parler <b>de</b> qc → le livre <b>dont</b> je t'ai parlé</i></li>
</ol>
<div class="rule"><b>qui oder que — der Zwei-Sekunden-Test:</b> Kommt danach ein Verb, ist es <b>qui</b>.
Kommt danach ein Subjekt (je, tu, mon frère …), ist es <b>que</b>. Vor Vokal wird que zu qu' — qui nie.</div>`;

EXPL.satzbau = () => `
<p class="lead">Der französische Satz ist strenger gebaut als der deutsche: Das Verb steht fast immer an derselben Stelle,
und was dazwischen darf, ist genau geregelt.</p>

<h3>Die Grundstellung</h3>
<div class="ex"><b>Subjekt – Verb – Objekt</b> · <i>Marie regarde un film.</i></div>
<p>Anders als im Deutschen kann man das Verb nicht ans Ende schieben und auch nicht einfach umstellen.
Zeit- und Ortsangaben stehen am <b>Anfang</b> oder am <b>Ende</b>, nicht mittendrin:</p>
<div class="ex"><b>Hier</b>, nous sommes allés au cinéma. · Nous sommes allés au cinéma <b>hier</b>.
<span style="color:var(--marge)">Nicht:</span> Nous sommes hier allés…</div>
<p>Kurze Adverbien (bien, mal, déjà, souvent, toujours, beaucoup) stehen direkt hinter dem Verb —
im passé composé zwischen Hilfsverb und Partizip:</p>
<div class="ex">J'ai <b>bien</b> dormi. · Elle a <b>déjà</b> mangé.</div>

<h3>Die Verneinung — eine Klammer um das Verb</h3>
<p>Französisch verneint mit <b>zwei</b> Teilen, die das konjugierte Verb einklammern.</p>
<ol class="steps">
<li><b>ne</b> vor das Verb (vor Vokal: <b>n'</b>).</li>
<li><b>pas</b> (oder plus, jamais, rien) dahinter.<br>
<i>Je <b>ne</b> mange <b>pas</b>. · Je <b>n'</b>ai <b>pas</b> mangé.</i></li>
<li>Im passé composé klammert man das <b>Hilfsverb</b> ein, nicht das Partizip.</li>
<li><b>personne</b> und <b>que</b> sind zu schwer und rutschen ganz nach hinten:
<i>Je n'ai vu <b>personne</b>. · Je n'ai bu <b>que</b> de l'eau.</i> (Vergleiche: <i>Je n'ai <b>rien</b> vu.</i>)</li>
<li>Vor einem Infinitiv bleiben beide Teile zusammen: <i>Il m'a dit de <b>ne pas</b> venir.</i></li>
</ol>
<div class="rule"><b>Die pas-de-Regel:</b> Nach einer Verneinung wird aus un, une, du, de la, des einfach <b>de</b>.<br>
<i>J'ai <b>un</b> frère → Je n'ai <b>pas de</b> frère. · Je bois <b>du</b> café → Je ne bois <b>pas de</b> café.</i><br>
Ausnahmen: nach <i>être</i> (Ce n'est pas <b>un</b> problème) und nach <i>ne … que</i>, weil das keine echte Verneinung ist.</div>
<p>Die wichtigsten Paare: ne … <b>pas</b> (nicht) · ne … <b>plus</b> (nicht mehr) · ne … <b>jamais</b> (nie) ·
ne … <b>rien</b> (nichts) · ne … <b>personne</b> (niemand) · ne … <b>que</b> (nur) · ne … <b>ni … ni</b> (weder … noch).</p>

<h3>Fragen stellen — drei Wege, ein Sinn</h3>
<ol class="steps">
<li><b>Intonation:</b> Aussagesatz, Stimme hoch. <i>Tu viens ?</i> — gesprochen, locker.</li>
<li><b>est-ce que</b> davorsetzen, sonst ändert sich nichts. <i>Est-ce que tu viens ?</i> — immer richtig, immer sicher.</li>
<li><b>Inversion:</b> Verb und Subjektpronomen tauschen, mit Bindestrich. <i>Viens-tu ?</i> — schriftlich, gehoben.</li>
</ol>
<div class="rule"><b>Das eingeschobene -t-:</b> Treffen bei der Inversion zwei Vokale aufeinander, schiebt man ein t dazwischen,
damit es sprechbar bleibt: <i>A-<b>t</b>-il un vélo ? · Va-<b>t</b>-elle à Paris ? · Aime-<b>t</b>-on ça ?</i></div>
<p>Mit Fragewort stellst du es einfach voran: <i>Quand est-ce que tu viens ? · Quand viens-tu ?</i></p>
<table class="tbl">
<tr><td class="fr">qui</td><td>wer</td><td class="fr">où / d'où</td><td>wo, wohin / woher</td></tr>
<tr><td class="fr">qu'est-ce que</td><td>was (Objekt) — <i>Qu'est-ce que tu fais ?</i></td><td class="fr">quand</td><td>wann</td></tr>
<tr><td class="fr">qu'est-ce qui</td><td>was (Subjekt) — <i>Qu'est-ce qui se passe ?</i></td><td class="fr">comment</td><td>wie</td></tr>
<tr><td class="fr">combien (de)</td><td>wie viel(e)</td><td class="fr">pourquoi</td><td>warum</td></tr>
<tr><td class="fr">quel / quelle / quels / quelles</td><td colspan="3">welcher — richtet sich nach dem Nomen: quel âge, quelle heure, quels films</td></tr>
</table>

<h3>Nebensätze anschließen</h3>
<p>Gute Nachricht: Die Wortstellung ändert sich im Nebensatz <b>nicht</b> — kein Verb ans Ende wie im Deutschen.</p>
<div class="ex">Je reste à la maison <b>parce que</b> je suis fatigué. — Ich bleibe zu Hause, weil ich müde <u>bin</u>.</div>
<p>Achtung nur bei drei Anschlüssen, die den subjonctif verlangen: <b>bien que</b> (obwohl), <b>pour que</b> (damit),
<b>avant que</b> (bevor).</p>
<div class="rule"><b>Vor und nach:</b> <i>avant de</i> + Infinitiv (avant de partir = bevor ich gehe) ·
<i>après</i> + avoir/être + Partizip (après avoir mangé = nachdem ich gegessen habe).
Beides geht nur, wenn beide Satzteile dieselbe Person betreffen.</div>

<h3>Etwas hervorheben</h3>
<p>Weil man Wörter nicht einfach umstellen kann, benutzt Französisch eine Konstruktion mit <b>c'est … qui/que</b>:</p>
<div class="ex">C'est Marie <b>qui</b> a gagné. (Das Hervorgehobene ist Subjekt)<br>
C'est ce livre <b>que</b> je préfère. (Das Hervorgehobene ist Objekt)</div>`;

EXPL.adjektive = () => `
<p class="lead">Adjektive beschreiben ein Nomen — und richten sich in Geschlecht und Zahl danach.
Adverbien beschreiben ein Verb und ändern sich nie. Das ist der ganze Unterschied.</p>

<h3>Die Angleichung in vier Schritten</h3>
<ol class="steps">
<li>Grundform ist das <b>männliche Singular</b>: petit.</li>
<li>Weiblich: <b>-e</b> anhängen — petit<b>e</b>. Endet das Adjektiv schon auf -e, passiert nichts: jeune → jeune.</li>
<li>Plural: <b>-s</b> anhängen — petit<b>s</b>, petit<b>es</b>. Endet es schon auf -s oder -x, passiert nichts: gris → gris.</li>
<li>Gemischte Gruppe (Männer und Frauen zusammen) → männlicher Plural.</li>
</ol>
<div class="rule"><b>Warum das laut wichtig ist:</b> Das angehängte -e macht den letzten Konsonanten hörbar.
petit [pəti] → petite [pətit]. Das -s hört man dagegen nie.</div>
<table class="tbl">
<tr><th>Endung</th><th>weiblich</th><th>Beispiel</th></tr>
<tr><td>-eux</td><td>-euse</td><td class="fr">heureux → heureuse</td></tr>
<tr><td>-if</td><td>-ive</td><td class="fr">sportif → sportive</td></tr>
<tr><td>-er</td><td>-ère</td><td class="fr">cher → chère, premier → première</td></tr>
<tr><td>-el, -eil, -il, -on</td><td>Doppelkonsonant + e</td><td class="fr">naturel → naturelle, gentil → gentille, bon → bonne</td></tr>
<tr><td>unregelmäßig</td><td></td><td class="fr">beau → belle · nouveau → nouvelle · vieux → vieille · blanc → blanche · long → longue</td></tr>
</table>
<div class="rule">Vor männlichen Nomen mit Vokal werden drei Adjektive weich gesprochen:
un <b>bel</b> appartement, un <b>nouvel</b> ami, un <b>vieil</b> homme.</div>

<h3>Vor oder hinter dem Nomen?</h3>
<p>Im Deutschen steht das Adjektiv immer davor, im Französischen meistens <b>dahinter</b>:</p>
<div class="ex">une voiture <b>rouge</b> · un livre <b>intéressant</b> · un film <b>français</b></div>
<p>Davor stehen nur wenige, meist kurze und sehr häufige — sie beschreiben Größe, Alter, Schönheit oder eine Wertung:</p>
<div class="ex">beau · joli · grand · petit · jeune · vieux · bon · mauvais · gros · nouveau · même · autre</div>
<p>Ein paar ändern je nach Stellung die Bedeutung: un <b>grand</b> homme (ein bedeutender Mann) vs.
un homme <b>grand</b> (ein großer Mann).</p>

<h3>Adverbien bilden — drei Schritte</h3>
<ol class="steps">
<li>Adjektiv in die <b>weibliche</b> Form setzen: lent → lent<b>e</b>.</li>
<li><b>-ment</b> anhängen: lente<b>ment</b>.</li>
<li>Fertig — Adverbien werden nie angeglichen.</li>
</ol>
<table class="tbl">
<tr><td>Normalfall</td><td class="fr">heureux → heureuse → heureusement</td></tr>
<tr><td>Adjektiv endet auf Vokal → kein e</td><td class="fr">vrai → vraiment · poli → poliment</td></tr>
<tr><td>Adjektiv auf -ent / -ant</td><td class="fr">prudent → prudemment · évident → évidemment · courant → couramment</td></tr>
<tr><td>unregelmäßig</td><td class="fr">bon → bien · mauvais → mal · meilleur → mieux · petit → peu</td></tr>
</table>
<div class="rule"><b>Wann Adjektiv, wann Adverb?</b> Frage dich, was beschrieben wird.
Ein <b>Nomen</b> → Adjektiv (Elle est <b>lente</b>). Ein <b>Verb</b> → Adverb (Elle parle <b>lentement</b>).</div>

<h3>Der Vergleich — ein Baukasten</h3>
<div class="ex"><b>plus / moins / aussi</b> + Adjektiv oder Adverb + <b>que</b></div>
<table class="tbl">
<tr><td>mehr</td><td class="fr">Marie est <b>plus</b> grande <b>que</b> Paul.</td></tr>
<tr><td>weniger</td><td class="fr">Paul est <b>moins</b> grand <b>que</b> Marie.</td></tr>
<tr><td>gleich</td><td class="fr">Léa est <b>aussi</b> grande <b>que</b> Marie.</td></tr>
</table>
<p>Vergleichst du <b>Mengen</b> (also Nomen), kommt ein <b>de</b> dazu:
<i>J'ai <b>plus de</b> livres <b>que</b> toi. · <b>autant de</b> temps <b>que</b> toi.</i></p>
<h4>Superlativ</h4>
<ol class="steps">
<li>Vergleichsform bilden: plus grand.</li>
<li>Bestimmten Artikel davor, passend zum Nomen: <b>le</b> plus grand, <b>la</b> plus grande, <b>les</b> plus grands.</li>
<li>Steht das Adjektiv hinter dem Nomen, wird der Artikel wiederholt:
<i>le film <b>le</b> plus intéressant</i>.</li>
<li>Der Bezug steht mit <b>de</b>: le plus intéressant <b>de</b> l'année.</li>
</ol>
<div class="rule"><b>Die zwei Unregelmäßigen, die immer geprüft werden:</b><br>
Adjektiv: bon → <b>meilleur</b> → le meilleur. Nie „plus bon“.<br>
Adverb: bien → <b>mieux</b> → le mieux. Nie „plus bien“.<br>

<script>
/* ---------- Uhrzeit-Generator ----------------------------- */
function hourOfficial(h){
  if(h === 0) return "zéro heure";
  return numFR(h).replace(/un$/, "une") + " heure" + (h > 1 ? "s" : "");
}
function hourCommon(h){
  const r = h % 12;
  if(h === 0)  return "minuit";
  if(h === 12) return "midi";
  return (r === 1 ? "une" : numFR(r)) + " heure" + (r > 1 ? "s" : "");
}
function timeFR(h, m){
  const off = hourOfficial(h) + (m ? " " + numFR(m) : "");
  let cour;
  if(m <= 30){
    const base = hourCommon(h);
    if(m === 0)       cour = base;
    else if(m === 15) cour = base + " et quart";
    else if(m === 30) cour = base + " et demi" + ((h % 12 === 0) ? "" : "e");
    else              cour = base + " " + numFR(m);
  } else {
    const nh = (h + 1) % 24, rest = 60 - m, base = hourCommon(nh);
    cour = base + (rest === 15 ? " moins le quart" : " moins " + numFR(rest));
  }
  return {off, cour};
}
function makeClockTask(){
  const h = Math.floor(Math.random()*24);
  const m = [0,5,10,15,20,25,30,35,40,45,50,55][Math.floor(Math.random()*12)];
  const {off, cour} = timeFR(h, m);
  const acc = new Set();
  [off, cour].forEach(f => { acc.add(f); acc.add("il est " + f); });
  return {t:"clock", skill:"clock", q:`Wie sagt man ${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")} ?`,
          sub:"Umgangssprachlich oder offiziell — beides zählt.",
          a:[...acc], full:`${cour}  ·  offiziell: ${off}`,
          why:"Bis 30 Minuten zählt man dazu, ab 31 zieht man von der nächsten Stunde ab."};
}

EXPL.artikel = () => `
<p class="lead">Vor fast jedem französischen Nomen steht ein Begleiter — anders als im Deutschen, wo man einfach
„Ich esse Brot" sagen kann. Die Frage ist nur: welcher?</p>

<h3>Die drei Artikelsorten</h3>
<table class="tbl">
<tr><th></th><th>männlich</th><th>weiblich</th><th>vor Vokal</th><th>Plural</th></tr>
<tr><td>bestimmt</td><td class="fr">le</td><td class="fr">la</td><td class="fr">l'</td><td class="fr">les</td></tr>
<tr><td>unbestimmt</td><td class="fr">un</td><td class="fr">une</td><td class="fr">un / une</td><td class="fr">des</td></tr>
<tr><td>Teilungsartikel</td><td class="fr">du</td><td class="fr">de la</td><td class="fr">de l'</td><td class="fr">des</td></tr>
</table>

<h3>Welcher wann? Drei Fragen</h3>
<ol class="steps">
<li><b>Weiß mein Gegenüber genau, welches Ding gemeint ist?</b> (schon erwähnt, einzigartig, oder allgemein die ganze Sorte)
→ bestimmter Artikel. <i>Passe-moi <b>le</b> pain. · <b>Le</b> soleil brille.</i></li>
<li><b>Ist es ein zählbares Einzelstück, das neu eingeführt wird?</b> → unbestimmter Artikel.
<i>J'ai acheté <b>un</b> pain.</i></li>
<li><b>Geht es um eine unbestimmte Menge von etwas, das man nicht zählt?</b> → Teilungsartikel.
<i>Je mange <b>du</b> pain. · Je bois <b>de l'</b>eau. · Il a <b>de la</b> chance.</i></li>
</ol>
<div class="rule"><b>Der Trick:</b> Setz im Deutschen testweise „etwas" oder „ein bisschen" davor.
Passt „ich esse <u>etwas</u> Brot"? Dann steht im Französischen der Teilungsartikel.
Der Teilungsartikel ist also nicht exotisch — im Deutschen steht dort einfach gar nichts.</div>

<h3>Die Ausnahme, die immer geprüft wird</h3>
<div class="rule">Nach <b>aimer, adorer, détester, préférer</b> steht der <b>bestimmte</b> Artikel, weil es um die Sorte
im Allgemeinen geht — nicht um eine Portion:<br>
<i>J'aime <b>le</b> chocolat</i> (ich mag Schokolade) — aber <i>Je mange <b>du</b> chocolat</i> (ich esse Schokolade).<br>
Und das bleibt auch in der Verneinung so: <i>Je n'aime pas <b>le</b> chocolat.</i></div>

<h3>Wann der Artikel zu de wird</h3>
<ol class="steps">
<li><b>Nach einer Verneinung:</b> un, une, du, de la, des → <b>de</b> (vor Vokal d').<br>
<i>J'ai <b>un</b> frère → Je n'ai <b>pas de</b> frère. · Je bois <b>du</b> café → Je ne bois <b>pas de</b> café.</i></li>
<li><b>Nach Mengenangaben:</b> beaucoup <b>de</b>, peu <b>de</b>, trop <b>de</b>, assez <b>de</b>, un kilo <b>de</b>,
une bouteille <b>d'</b>eau.</li>
<li><b>Zwei Ausnahmen:</b> nach <i>être</i> (Ce n'est pas <b>un</b> problème) und nach <i>ne … que</i>
(Je ne bois que <b>du</b> thé) — weil das keine echte Verneinung ist.</li>
</ol>

<h3>Possessivbegleiter — mein, dein, sein</h3>
<table class="tbl">
<tr><th></th><th>männlich</th><th>weiblich</th><th>Plural</th></tr>
<tr><td>ich</td><td class="fr">mon</td><td class="fr">ma</td><td class="fr">mes</td></tr>
<tr><td>du</td><td class="fr">ton</td><td class="fr">ta</td><td class="fr">tes</td></tr>
<tr><td>er / sie</td><td class="fr">son</td><td class="fr">sa</td><td class="fr">ses</td></tr>
<tr><td>wir</td><td class="fr">notre</td><td class="fr">notre</td><td class="fr">nos</td></tr>
<tr><td>ihr</td><td class="fr">votre</td><td class="fr">votre</td><td class="fr">vos</td></tr>
<tr><td>sie (Plural)</td><td class="fr">leur</td><td class="fr">leur</td><td class="fr">leurs</td></tr>
</table>
<div class="rule"><b>Der wichtigste Unterschied zum Deutschen:</b> Der Begleiter richtet sich nach dem <b>Ding</b>,
nicht nach dem Besitzer. <i>son vélo</i> heißt sein <b>oder</b> ihr Fahrrad — man erkennt es nur am Zusammenhang.
Wer besitzt, ist dem Französischen hier egal; wichtig ist nur, ob das Ding männlich, weiblich oder Plural ist.<br><br>
<b>Und:</b> Vor einem Vokal steht immer die männliche Form — <i>mon amie, ton école, son histoire</i>.</div>

<h3>Demonstrativbegleiter — dieser, diese</h3>
<div class="ex"><b>ce</b> livre · <b>cet</b> homme (männlich vor Vokal/stummem h) · <b>cette</b> fille · <b>ces</b> enfants</div>
<p>Wenn man unterscheiden will, hängt man <b>-ci</b> (hier) oder <b>-là</b> (dort) an:
<i>ce livre-<b>ci</b> ou ce livre-<b>là</b> ?</i></p>

<h3>c'est oder il est?</h3>
<table class="tbl">
<tr><th>c'est / ce sont</th><th>il est / elle est</th></tr>
<tr><td>+ Artikel + Nomen: <i>C'est un bon film.</i></td><td>+ Adjektiv: <i>Il est intéressant.</i></td></tr>
<tr><td>+ Name: <i>C'est Marie.</i></td><td>+ Beruf ohne Artikel: <i>Elle est prof.</i></td></tr>
<tr><td>+ betontes Pronomen: <i>C'est moi.</i></td><td>+ Nationalität ohne Artikel: <i>Il est allemand.</i></td></tr>
<tr><td>allgemeine Bewertung: <i>C'est difficile.</i></td><td>bezogen auf jemanden/etwas Konkretes: <i>Ce livre ? Il est difficile.</i></td></tr>
</table>
<div class="rule"><b>Faustregel:</b> Kommt ein <b>Artikel</b> hinterher, muss <b>c'est</b> davor.</div>`;

EXPL.indirekt = () => `
<p class="lead">Indirekte Rede heißt: Du gibst wieder, was jemand gesagt hat, ohne ihn wörtlich zu zitieren.
Aus « Je viens » wird <i>Il dit qu'il vient</i>. Dabei ändern sich vier Dinge — und zwar immer in derselben Reihenfolge.</p>

<h3>Schritt 1: Den richtigen Anschluss wählen</h3>
<table class="tbl">
<tr><th>Was war es?</th><th>Anschluss</th><th>Beispiel</th></tr>
<tr><td>eine Aussage</td><td class="fr">que / qu'</td><td>« Je viens. » → Il dit <b>qu'</b>il vient.</td></tr>
<tr><td>eine Ja/Nein-Frage</td><td class="fr">si</td><td>« Tu viens ? » → Il demande <b>si</b> je viens.</td></tr>
<tr><td>Frage mit qu'est-ce que</td><td class="fr">ce que</td><td>« Qu'est-ce que tu fais ? » → Il demande <b>ce que</b> je fais.</td></tr>
<tr><td>Frage mit qu'est-ce qui</td><td class="fr">ce qui</td><td>« Qu'est-ce qui se passe ? » → Il demande <b>ce qui</b> se passe.</td></tr>
<tr><td>Frage mit Fragewort</td><td class="fr">bleibt</td><td>« Où habites-tu ? » → Il demande <b>où</b> j'habite.</td></tr>
<tr><td>eine Aufforderung</td><td class="fr">de + Infinitiv</td><td>« Viens ! » → Il me dit <b>de venir</b>.</td></tr>
</table>
<div class="rule">Im Nebensatz gibt es <b>keine Inversion</b> und <b>kein Fragezeichen</b> mehr:
nicht <i>où habite-je</i>, sondern <i>où j'habite</i>. Der Nebensatz ist ein normaler Aussagesatz.</div>

<h3>Schritt 2: Die Person wechseln</h3>
<p>Wer spricht, ändert sich — also ändern sich Pronomen und Possessivbegleiter:</p>
<div class="ex">Paul : « <b>Je</b> prends <b>mon</b> vélo. » → Paul dit qu'<b>il</b> prend <b>son</b> vélo.</div>

<h3>Schritt 3: Die Zeit verschieben — aber nur manchmal</h3>
<p>Steht das einleitende Verb im <b>Präsens</b> (il dit, il demande), ändert sich an der Zeit <b>nichts</b>.
Steht es in der <b>Vergangenheit</b> (il a dit, il a demandé), rutscht alles eine Stufe zurück:</p>
<table class="tbl">
<tr><th>direkte Rede</th><th>indirekte Rede</th></tr>
<tr><td class="fr">présent</td><td class="fr">imparfait</td></tr>
<tr><td class="fr">passé composé</td><td class="fr">plus-que-parfait</td></tr>
<tr><td class="fr">futur</td><td class="fr">conditionnel</td></tr>
<tr><td class="fr">imparfait</td><td class="fr">imparfait (bleibt)</td></tr>
<tr><td class="fr">conditionnel</td><td class="fr">conditionnel (bleibt)</td></tr>
</table>
<div class="ex">Il a dit : « Je <b>suis</b> fatigué. » → Il a dit qu'il <b>était</b> fatigué.<br>
Il a dit : « J'<b>ai fini</b>. » → Il a dit qu'il <b>avait fini</b>.<br>
Il a dit : « Je <b>viendrai</b>. » → Il a dit qu'il <b>viendrait</b>.</div>
<div class="rule"><b>Warum?</b> Weil der Moment des Sprechens vorbei ist. Was damals Gegenwart war, ist aus heutiger
Sicht Vergangenheit — genau wie im Deutschen „Er sagte, er <u>sei</u> müde".</div>

<h3>Schritt 4: Zeit- und Ortsangaben mitziehen</h3>
<table class="tbl">
<tr><td class="fr">aujourd'hui → ce jour-là</td><td class="fr">hier → la veille</td></tr>
<tr><td class="fr">demain → le lendemain</td><td class="fr">maintenant → à ce moment-là</td></tr>
<tr><td class="fr">la semaine prochaine → la semaine suivante</td><td class="fr">ici → là</td></tr>
</table>
<div class="rule">Auch das nur, wenn die Einleitung in der Vergangenheit steht — und nur, wenn der Zeitpunkt wirklich
ein anderer ist. Erzählst du am selben Tag weiter, bleibt <i>aujourd'hui</i> stehen.</div>`;

EXPL.passiv = () => `
<p class="lead">Im Aktiv steht im Mittelpunkt, <b>wer</b> etwas tut. Im Passiv steht im Mittelpunkt, <b>was</b> mit
etwas geschieht. Der Handelnde darf sogar ganz verschwinden — genau dafür gibt es das Passiv.</p>

<h3>Die Bildung</h3>
<div class="ex"><b>être</b> (in der Zeit des Aktivsatzes) + <b>Partizip</b> (angeglichen ans Subjekt)</div>
<p>Nur <i>être</i> wird konjugiert. Das Partizip ändert sich nur nach Geschlecht und Zahl — wie ein Adjektiv.</p>
<table class="tbl">
<tr><th>Zeit</th><th>Aktiv</th><th>Passiv</th></tr>
<tr><td>présent</td><td class="fr">On regarde le film.</td><td class="fr">Le film <b>est</b> regardé.</td></tr>
<tr><td>passé composé</td><td class="fr">On a regardé le film.</td><td class="fr">Le film <b>a été</b> regardé.</td></tr>
<tr><td>imparfait</td><td class="fr">On regardait le film.</td><td class="fr">Le film <b>était</b> regardé.</td></tr>
<tr><td>futur</td><td class="fr">On regardera le film.</td><td class="fr">Le film <b>sera</b> regardé.</td></tr>
<tr><td>conditionnel</td><td class="fr">On regarderait le film.</td><td class="fr">Le film <b>serait</b> regardé.</td></tr>
</table>

<h3>Vom Aktiv zum Passiv — drei Schritte</h3>
<ol class="steps">
<li>Das <b>direkte Objekt</b> wird zum neuen <b>Subjekt</b> und rückt nach vorn.</li>
<li>Das Verb wird zu <b>être + Partizip</b> — in derselben Zeit wie vorher. Partizip ans neue Subjekt angleichen.</li>
<li>Das alte Subjekt hängt mit <b>par</b> hinten dran — oder fällt weg, wenn es egal ist.</li>
</ol>
<div class="ex">Marie <b>écrit</b> <u>la lettre</u>. → <u>La lettre</u> <b>est écrite</b> par Marie.<br>
Les élèves <b>ont planté</b> <u>les arbres</u>. → <u>Les arbres</u> <b>ont été plantés</b> par les élèves.</div>

<h3>par oder de?</h3>
<div class="rule"><b>par</b> bei einer echten Handlung: <i>Le toit a été détruit <b>par</b> la tempête.</i><br>
<b>de</b> bei Gefühlen und Zuständen: <i>Il est aimé <b>de</b> tous. · Le sol était couvert <b>de</b> neige.</i></div>

<h3>Die wichtigste Einschränkung</h3>
<p>Nur Verben mit <b>direktem</b> Objekt können ins Passiv. Alles, was mit <b>à</b> angeschlossen wird
(téléphoner à, parler à, répondre à, aider … im Deutschen mit Dativ), kann kein Passiv bilden.</p>
<div class="rule">Deshalb gibt es im Französischen keine Entsprechung zu „Mir wurde geholfen".
Man sagt stattdessen: <b>On m'a aidé.</b></div>

<h3>on — die französische Lieblingslösung</h3>
<p>Wo im Deutschen ein Passiv ohne Urheber steht, nimmt Französisch meistens einfach <b>on</b> + Aktiv.
Das klingt natürlicher und ist kürzer:</p>
<table class="tbl">
<tr><td>Hier wird Französisch gesprochen.</td><td class="fr">Ici, <b>on</b> parle français.</td></tr>
<tr><td>Mir wurde mein Fahrrad gestohlen.</td><td class="fr"><b>On</b> m'a volé mon vélo.</td></tr>
<tr><td>Das macht man nicht.</td><td class="fr"><b>On</b> ne fait pas ça.</td></tr>
</table>
<div class="rule"><b>Faustregel für Aufsätze:</b> Steht kein Urheber im Satz, nimm <b>on</b>.
Steht ein Urheber drin und soll das Ergebnis betont werden, nimm das Passiv mit <b>par</b>.</div>`;

EXPL.zeitdatum = () => `
<p class="lead">Für die Uhrzeit gibt es zwei Systeme nebeneinander: das lockere 12-Stunden-System für den Alltag und
das offizielle 24-Stunden-System für Fahrpläne, Kino und Radio. Beide muss man verstehen, benutzen darf man, was passt.</p>

<h3>Die Uhrzeit umgangssprachlich</h3>
<ol class="steps">
<li>Beginne mit <b>Il est</b> + Stundenzahl + <b>heure(s)</b>. Achtung: <i>une heure</i> (weiblich, ohne -s),
ab zwei: <i>deux heures</i>. 12:00 = <b>midi</b>, 0:00 = <b>minuit</b> — dort steht nie „heures".</li>
<li><b>Bis 30 Minuten wird dazugezählt:</b> huit heures dix · huit heures <b>et quart</b> (15) ·
huit heures <b>et demie</b> (30).</li>
<li><b>Ab 31 Minuten wird abgezogen</b> — von der <b>nächsten</b> Stunde:
neuf heures <b>moins</b> vingt (8:40) · neuf heures <b>moins le quart</b> (8:45).</li>
<li>Bei Bedarf präzisieren: <b>du matin</b> (morgens), <b>de l'après-midi</b> (nachmittags), <b>du soir</b> (abends).</li>
</ol>
<div class="rule"><b>Der eine Schreibfehler, der immer passiert:</b> <i>et demi<b>e</b></i> nach <i>heure</i> (weiblich),
aber <i>et demi</i> nach <i>midi</i> und <i>minuit</i> (männlich). Also: <i>une heure et demie</i>, aber <i>midi et demi</i>.</div>

<h3>Die Uhrzeit offiziell</h3>
<p>Einfach durchzählen bis 23, dann die Minuten als normale Zahl — ohne <i>quart</i>, ohne <i>moins</i>, ohne <i>demie</i>:</p>
<div class="ex">14:45 → <b>quatorze heures quarante-cinq</b> · 20:30 → <b>vingt heures trente</b> · 21:00 → <b>vingt et une heures</b></div>

<h3>Danach fragen</h3>
<div class="ex"><b>Quelle heure est-il ?</b> — Wie spät ist es?<br>
<b>À quelle heure … ?</b> — Um wie viel Uhr …? Antwort mit <b>à</b>: <i>à huit heures et demie</i>.</div>

<h3>Das Datum</h3>
<ol class="steps">
<li>Aufbau: <b>le</b> + Zahl + Monat (+ Jahr) — <i>le 14 juillet 1789</i>. Kein „von", kein Punkt.</li>
<li>Nur der Erste ist eine Ordnungszahl: <b>le 1<sup>er</sup> mai</b>. Alle anderen sind normale Zahlen: le 2 mai, le 3 mai.</li>
<li>Monate und Wochentage schreibt man <b>klein</b>: janvier, février … lundi, mardi …</li>
<li>Fragen: <i>Quelle est la date d'aujourd'hui ?</i> oder umgangssprachlich <i>On est le combien ?</i></li>
</ol>

<h3>Wochentage: lundi oder le lundi?</h3>
<div class="rule"><b>ohne Artikel</b> = ein einzelner, konkreter Tag: <i>Je pars <b>lundi</b></i> (diesen Montag).<br>
<b>mit Artikel</b> = jede Woche, also eine Gewohnheit: <i><b>Le lundi</b>, j'ai sport</i> (montags).<br>
Denselben Unterschied gibt es bei <i>le matin</i> (morgens) und <i>ce matin</i> (heute Morgen).</div>

<h3>Zeitangaben rund um Monat und Jahr</h3>
<table class="tbl">
<tr><td class="fr">en janvier, en mai</td><td>im Januar, im Mai</td></tr>
<tr><td class="fr">au printemps · en été, en automne, en hiver</td><td>im Frühling · im Sommer, Herbst, Winter</td></tr>
<tr><td class="fr">en 2026</td><td>im Jahr 2026</td></tr>
<tr><td class="fr">de … à … / du lundi au vendredi</td><td>von … bis … / von Montag bis Freitag</td></tr>
<tr><td class="fr">à partir de … / jusqu'à …</td><td>ab … / bis …</td></tr>
</table>`;

EXPL.redemittel = () => `
<p class="lead">In einer Klassenarbeit verlierst du selten Punkte, weil dir eine Vokabel fehlt — sondern weil der Text
keine Struktur hat. Diese Bausteine kannst du auswendig einsetzen, egal um welches Thema es geht.</p>

<h3>Eine Stellungnahme aufbauen</h3>
<ol class="steps">
